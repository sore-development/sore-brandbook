<svg xmlns="http://www.w3.org/2000/svg" width="580" height="170" viewBox="0 0 580 170" fill="none">
  <defs>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Subtle checkerboard to indicate transparent canvas in preview -->
  <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#242424"/>
    <rect x="8" y="8" width="8" height="8" fill="#242424"/>
    <rect x="8" width="8" height="8" fill="#1b1b1b"/>
    <rect y="8" width="8" height="8" fill="#1b1b1b"/>
  </pattern>
  <rect width="580" height="170" fill="url(#checker)" rx="16" opacity="0.4"/>

  <!-- Top track info header -->
  <text x="290" y="38" fill="#cacaca" fill-opacity="0.75" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" text-anchor="middle" filter="url(#textGlow)">Looking for Love in Wrong Places - Assia Keva</text>

  <!-- Slot 1: Previous Line -->
  <text x="290" y="70" fill="#cacaca" fill-opacity="0.45" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" text-anchor="middle" filter="url(#textGlow)">Looking for love in wrong places</text>

  <!-- Slot 2: Active Current Line -->
  <text x="290" y="104" fill="#ffffff" font-size="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle" filter="url(#textGlow)">Putting home on the wrong faces</text>

  <!-- Slot 3: Next Line -->
  <text x="290" y="134" fill="#cacaca" fill-opacity="0.5" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" text-anchor="middle" filter="url(#textGlow)">Oh, tell me where it ends</text>
</svg>