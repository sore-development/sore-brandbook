      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card Container #434143 -->
  <rect x="20" y="12" width="520" height="146" rx="18" fill="#434143" stroke="#615f61" stroke-width="1.2" stroke-opacity="0.3" filter="url(#cardShadow)"/>

  <!-- Top track info header -->
  <text x="280" y="38" fill="#cacaca" fill-opacity="0.65" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" text-anchor="middle">Looking for Love in Wrong Places - Assia Keva</text>

  <!-- Slot 1: Previous Line (opacity 35%, 13.5px) -->
  <text x="280" y="68" fill="#cacaca" fill-opacity="0.35" font-size="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" text-anchor="middle">Looking for love in wrong places</text>

  <!-- Slot 2: Active Current Line (bold white, 18.5px) -->
